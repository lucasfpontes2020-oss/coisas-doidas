<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Planejador de Estudos</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <div class="container">

        <h1 id="título"> Meu Planejador de Estudos</h1>

        <h2>Nova tarefa</h2>

        <input type="text" id="tarefa" placeholder="Digite o nome da tarefa">

        <input type="text" id="matéria" placeholder="Digite a matéria">

        <select id="prioridade">
            <option value="">Selecione a prioridade</option>
            <option value="Baixa">Baixa</option>
            <option value="Média">Média</option>
            <option value="Alta">Alta</option>
        </select>

        <button onclick="adicionarTarefa()">
            Cadastrar tarefa
        </button>

        <button onclick="limparCampos()">
            Limpar campos
        </button>

        <p id="mensagem"></p>

        <div class="contadores">

            <p id="contador">tarefas cadastradas: 0</p>
            <p id="contador-concluida-s">tarefa concluidas: 0</p>

            <button onclick="alternarModo()">
                Modo de concentração
            </button>

            <h2>Minhas tarefas</h2>

        </div id="listaTarefas">

    </div>

    <script src="script.js"></script>

</body>

</html>
