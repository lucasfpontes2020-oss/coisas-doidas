<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>

    <table border="1">
        <caption>Produto simples</caption>

        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Camisa</td>
                <td>R$50,00</td>
            </tr>
        </tbody>
    </table>

    <br>

    <table border="1">
        <caption>Camisas e benefícios</caption>

        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Benefício</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Camisa roxa</td>
                <td>R$49,99</td>
                <td>Você fica bonito</td>
            </tr>
            <tr>
                <td>Camisa azul</td>
                <td>R$29,99</td>
                <td>Camisa legal</td>
            </tr>
            <tr>
                <td>Camisa laranja</td>
                <td>R$19,99</td>
                <td>Você fica feio</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
