<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Viagem</title>
</head>

<body>

    <h1 id="titulo">Painel de Viagem</h1>

    <input id="cidade" type="text" placeholder="Digite uma cidade">

    <button id="botaoCidade">Mostrar cidade</button>

    <p id="mensagem"></p>

    <button id="botaoEstilo">Destacar mensagem</button>

    <hr>

    <h2>Contador</h2>

    <button id="botaoMenos">-</button>

    <span id="contador">0</span>

    <button id="botaoMais">+</button>

    <script src="script.js"></script>

</body>
</html>
